services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8005:8005"
      - "${PANEL_WEB_PORT:-3002}:8085"
    environment:
      EITAA_SERVICE_URL: http://eitaa-bun:1234
      EITAA_STATE_DIR: /app/data/eitaa-state
      EITAA_MEDIA_DIR: /shared/eitaa-media
    volumes:
      - eitaa_state:/app/data/eitaa-state
      - eitaa_media:/shared/eitaa-media
    depends_on:
      eitaa-bun:
        condition: service_healthy

  eitaa-bun:
    build:
      context: ./eitaa-service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "1234"
    volumes:
      - eitaa_sessions:/root/eitaSessions
      - eitaa_media:/shared/eitaa-media
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:1234/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s

volumes:
  eitaa_state:
  eitaa_sessions:
  eitaa_media:
